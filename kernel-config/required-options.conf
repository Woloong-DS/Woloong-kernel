# ============================================================================
# Klipper 必需项声明（Woloong）
#
# 作用：
#   1) 编译工作流里的校验步骤会读本文件，确认 config-<版本> 中这些项确实启用；
#   2) kernel-config/tools/sync-from-upstream.sh 会用这里的值强制覆盖官方基线配置。
#   这样“接收官方更新”与“Klipper 能力不被官方变动影响”可以同时成立。
#
# 格式：
#   CONFIG_XXX=值   → 校验：该项必须处于启用状态（=y 或 =m，不能是 not set）
#                     同步：强制写成这个值
#   SCOPE=6.18      → 只对这些内核主版本做“强制校验/强制覆盖”；其它版本仅告警
# ============================================================================

SCOPE=6.18

# --- CAN / SocketCAN（Klipper CAN 工具头必需）---
CONFIG_CAN=m
CONFIG_CAN_RAW=m
CONFIG_CAN_BCM=m
CONFIG_CAN_GW=m
CONFIG_CAN_DEV=m
CONFIG_CAN_GS_USB=m

# --- USB 串口（打印板 MCU / USB-CAN 盒）---
CONFIG_USB_ACM=m
CONFIG_USB_SERIAL=y
CONFIG_USB_SERIAL_CH341=y
CONFIG_USB_SERIAL_CP210X=y
CONFIG_USB_SERIAL_FTDI_SIO=y
CONFIG_USB_SERIAL_PL2303=y

# --- 品牌标识（非 Klipper 功能，但同样不能被同步覆盖）---
CONFIG_LOCALVERSION="-Woloong"

# --- 传感器 / 加速计 / 风扇（Klipper 常用外设）---
CONFIG_SPI_SPIDEV=m
CONFIG_I2C_CHARDEV=y
CONFIG_PWM=y
CONFIG_HWMON=y
